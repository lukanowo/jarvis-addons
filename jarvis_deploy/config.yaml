name: Jarvis Deploy
version: "0.1.6"
slug: jarvis_deploy
description: Sicherer lokaler Deployment-Dienst für freigegebene Jarvis-Integrationen
url: https://github.com/lukanowo/jarvis-home-assistant
image: ghcr.io/lukanowo/jarvis-deploy
arch:
  - aarch64
  - amd64
init: false
stage: experimental
startup: services
boot: auto
watchdog: "http://[HOST]:[PORT:8099]/health"
ingress: true
ingress_stream: true
ingress_port: 8099
panel_icon: mdi:package-variant-closed
panel_title: Jarvis Deploy
panel_admin: true
hassio_api: true
hassio_role: homeassistant
homeassistant_api: true
auth_api: false
docker_api: false
full_access: false
host_network: false
host_pid: false
host_ipc: false
host_uts: false
host_dbus: false
apparmor: true
homeassistant: "2026.11.0"
map:
  - config:rw
environment:
  JARVIS_DEPLOY_CHANNEL: production
options:
  repository: lukanowo/jarvis-home-assistant
  release_prefix: jarvis-memory-v
  github_token: ""
  check_interval_hours: 6
  backup_retention: 5
  min_free_space_mb: 200
  restart_timeout_seconds: 300
  dry_run: false
  deployment_enabled: false
  allow_prerelease: false
schema:
  repository: str
  release_prefix: str
  github_token: password
  check_interval_hours: int(1,168)
  backup_retention: int(1,20)
  min_free_space_mb: int(50,2000)
  restart_timeout_seconds: int(60,900)
  dry_run: bool
  deployment_enabled: bool
  allow_prerelease: bool
